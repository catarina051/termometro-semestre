name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: python -m pip install -r requirements.txt
      # Os resultados agregados estão no repositório e são testados aqui. Os testes da tabela
      # de tentativas precisam dos ~800 MB de dados brutos da UFRN e são pulados no CI.
      - name: Testes
        run: python -m pytest -q -rs tests
